name: VPS chequeo (solo lectura)

# Ejecuta deploy/chequear_vps.sh en el VPS y muestra la salida. No cambia nada en el servidor.
# Secrets necesarios (Settings > Secrets and variables > Actions):
#   VPS_HOST, VPS_PORT, VPS_USER y VPS_PASSWORD (o VPS_SSH_KEY con una clave privada en vez de la contraseña)
on:
  workflow_dispatch:

jobs:
  chequear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "$VPS_SSH_KEY" ]; then printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_vps; chmod 600 ~/.ssh/id_vps; fi
      - name: Ejecutar chequeo
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          OPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p ${VPS_PORT:-22}"
          if [ -f ~/.ssh/id_vps ]; then
            ssh $OPTS -i ~/.ssh/id_vps "$VPS_USER@$VPS_HOST" 'bash -s' < deploy/chequear_vps.sh
          else
            sshpass -e ssh $OPTS "$VPS_USER@$VPS_HOST" 'bash -s' < deploy/chequear_vps.sh
          fi
